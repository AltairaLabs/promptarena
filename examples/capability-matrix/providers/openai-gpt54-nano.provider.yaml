apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai-gpt54-nano
spec:
  id: openai-gpt54-nano
  type: openai
  model: gpt-5.4-nano
  capabilities:
    - text
    - streaming
    - tools
    - json
  defaults:
    temperature: 0.1
    max_tokens: 100
    top_p: 1.0
  pricing:
    input_cost_per_1k: 0.0002
    output_cost_per_1k: 0.00125
  pricing_correct_at: '2026-11-10'
  stream_retry:
    enabled: true
    max_attempts: 3
