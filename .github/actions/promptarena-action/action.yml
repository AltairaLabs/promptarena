name: 'PromptArena Test Runner'
description: 'Run PromptArena tests in your CI/CD pipeline with native GitHub integration'
author: 'AltairaLabs'

branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  config-file:
    description: 'Path to Arena YAML configuration file'
    required: true
  version:
    description: 'PromptArena version to use (e.g., v2.4.0 or latest)'
    required: false
    default: 'latest'
  scenarios:
    description: 'Comma-separated list of scenarios to run'
    required: false
  providers:
    description: 'Comma-separated list of providers to use'
    required: false
  regions:
    description: 'Comma-separated list of regions to run'
    required: false
  output-dir:
    description: 'Directory for test results'
    required: false
    default: 'out'
  formats:
    description: 'Output formats (comma-separated): json, junit, markdown, csv, objectives'
    required: false
    default: 'json,junit'
  junit-output:
    description: 'Path for JUnit XML output file'
    required: false
  override-providers:
    description: 'Provider substitutions as comma-separated from=to pairs (e.g. mock-judge=claude-haiku)'
    required: false
  fail-on-error:
    description: 'Fail the action if tests fail'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory for running tests'
    required: false
    default: '.'

outputs:
  passed:
    description: 'Number of passed runs'
  failed:
    description: 'Number of runs that did not pass (execution errors and assertion failures; skipped runs excluded)'
  errors:
    description: 'Number of runs that did not pass, as recorded in index.json "errors" (the same count as failed)'
  total:
    description: 'Total number of tests'
  total-cost:
    description: 'Total cost in dollars'
  success:
    description: 'Whether all tests passed (true/false)'
  junit-path:
    description: 'Path to generated JUnit XML file'

runs:
  using: 'node24'
  main: 'dist/index.js'
