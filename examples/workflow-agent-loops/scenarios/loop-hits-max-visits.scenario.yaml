apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: loop-hits-max-visits
spec:
  id: loop-hits-max-visits
  task_type: research
  description: "Agent keeps asking for More; max_visits forces a redirect to summarise"

  # One user turn, as with loop-converges: the agent keeps requesting another
  # research iteration and the runtime — not the agent — stops it. The turn
  # count used to be calibrated so each iteration got its own scripted turn;
  # with transitions taking effect in-turn, the iterations happen back to back
  # and the cap is reached without any further user input.
  turns:
    - role: user
      content: "Please research something."
      assertions:
        - type: tools_called
          params:
            tool_names: ["workflow__transition"]

  conversation_assertions:
    # The cap redirected the loop into summarize rather than the agent choosing
    # to leave research.
    - type: transitioned_to
      params:
        state: summarize
      message: "Hitting max_visits must redirect the loop into summarize"
    - type: workflow_complete
      params: {}

    # The redirect destination has to speak for itself, same as any other
    # handoff — a redirect that produces no output is the bug this guards.
    - type: spoke_in_state
      params:
        state: summarize
      message: "The redirect destination must answer within the turn"
