apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: anthropic-opus5
spec:
  id: anthropic-opus5
  type: claude
  # Bare alias rather than a dated snapshot. The entry this replaces pinned
  # claude-opus-4-1-20250805, which Anthropic retired — every scenario against
  # it then 404'd, and because the matrix bills real API calls it spent money
  # weekly to produce a failure. Aliases roll forward instead.
  model: claude-opus-5
  capabilities:
    - text
    - streaming
    - vision
    - tools
    - json
    - documents
  # Claude Opus 4.7+ deprecated the temperature parameter (API returns 400 if
  # sent). The Claude provider drops params listed here before the request.
  unsupported_params:
    - temperature
  defaults:
    # temperature is required by the schema; unsupported_params strips it from
    # the request so Claude 4.7+ (which rejects it) never receives it.
    temperature: 0.1
    top_p: 1.0
    max_tokens: 100
  pricing:
    input_cost_per_1k: 0.005
    output_cost_per_1k: 0.025
  stream_retry:
    enabled: true
    max_attempts: 3
