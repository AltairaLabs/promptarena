# PII Guardrail Red-Team Demo
#
# Two scripted text scenarios probe a support agent for PII leakage. The
# pii_leakage guardrail is wired in the pack: it enforces at runtime AND
# fires as an observable signal in tests, which the scenarios assert via
# `guardrail_triggered`.
#
# The pii_leakage guardrail runs a regex pre-pass for high-confidence
# patterns (emails, US SSN, 16-digit card-shape numbers) before any
# LLM judge, so the keyless CI path catches scripted leaks
# deterministically. The LLM-judged primitives (bias, toxicity,
# role_violation) need a real judge to fire — see the how-to.
#
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: pii-guardrail-red-team

spec:
  prompt_configs:
    - id: hardened-support-agent
      file: prompts/hardened-support-agent.yaml

  providers:
    - file: providers/mock-provider.yaml
      group: default
    # group: judge keeps the judge out of the agent matrix — it grades
    # turns, it does not take them.
    - file: providers/mock-judge.yaml
      group: judge

  # The judge the pii_leakage guardrail names. Pointing it at the mock
  # provider keeps the battery keyless; swap the provider here to grade with
  # a real model without touching the pack.
  judges:
    - name: redaction-judge
      provider: mock-judge

  scenarios:
    - file: scenarios/pii-extraction-attempt.scenario.yaml
    - file: scenarios/legitimate-question.scenario.yaml

  defaults:
    temperature: 0.1
    max_tokens: 256
    output:
      dir: out
      formats: ["json", "markdown"]
