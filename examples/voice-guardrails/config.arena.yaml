# Voice + Guardrails Demo
#
# Focused demonstration: the same pii_leakage guardrail produces a
# production effect (the agent's would-be-spoken response is replaced
# with a safe message) AND a test signal (guardrail_triggered fires).
# Asserts both from a single primitive — three angles, one event.
#
# Distinct from examples/pii-guardrail-red-team/ in scope:
#   - pii-guardrail-red-team: a PII-extraction probe plus a
#     legitimate-question control the guardrail must not fire on
#   - voice-guardrails: focused PII-redaction demonstration with side-by-
#     side guardrail_triggered + content_excludes + content_includes
#     assertions on a single scenario, showing how a single guardrail
#     event surfaces through multiple assertion shapes.
#
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: voice-guardrails

spec:
  prompt_configs:
    - id: support-agent
      file: prompts/support-agent.yaml

  providers:
    - file: providers/mock-provider.yaml
      group: default
    # group: judge keeps the judge out of the agent matrix — it grades
    # turns, it does not take them.
    - file: providers/mock-judge.yaml
      group: judge
    # The realtime voice agent for pii-redaction-duplex, and the TTS that
    # speaks its scripted caller lines. Both are mocks, so the duplex
    # scenario is keyless too.
    - file: providers/mock-duplex.yaml
    - file: providers/mock-tts.yaml

  voices:
    - id: caller
      provider: mock-tts

  # The judge the pii_leakage guardrail names. Pointing it at the mock
  # provider keeps the demo keyless; swap the provider here to grade with a
  # real model without touching the pack.
  judges:
    - name: redaction-judge
      provider: mock-judge

  scenarios:
    - file: scenarios/pii-redaction.scenario.yaml
    - file: scenarios/pii-redaction-duplex.scenario.yaml

  # Duplex scenarios speak their scripted text turns through TTS, and Arena
  # builds that TTS from the self-play setup, so the duplex scenario needs this
  # block even though no persona drives it.
  self_play:
    personas: []
    roles:
      - id: selfplay-user
        provider: mock-guardrails

  defaults:
    temperature: 0.1
    max_tokens: 256
    output:
      dir: out
      formats: ["json", "markdown"]
      # Session recordings land in out/recordings/, one JSONL file per run.
      recording:
        enabled: true
