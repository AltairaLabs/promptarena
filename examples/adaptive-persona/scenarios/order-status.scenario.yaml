# yaml-language-server: $schema=../../../schemas/v1alpha1/scenario.json
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: order-status
spec:
  id: order-status
  task_type: support
  description: A customer with declared facts asks where their order is

  turns:
    - role: user
      content: "Hi."

    - role: customer
      persona: order-chaser
      turns: 4
      # Each message is rewritten as a hurried user would type it before the
      # agent sees it; the persona, and its fidelity check, see what it wrote.
      transforms:
        - exec:
            command: python3
            args: [transforms/hurried.py]
      objective:
        description: Find out where order A-100 is
        success:
          - type: content_includes
            params:
              patterns: ["out for delivery"]

  # The agent must not refuse a plain order-status question: an over-refusal
  # check on its last reply.
  conversation_assertions:
    - type: refusal
      params:
        max_score: 0
      message: Answers a plain order-status question
