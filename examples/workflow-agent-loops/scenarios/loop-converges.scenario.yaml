apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: loop-converges
spec:
  id: loop-converges
  task_type: research
  description: "Agent loop iterates, summarises and completes from one user turn"

  # This scenario is the regression test for in-turn workflow state handoff
  # (PromptKit#1747, promptarena#109).
  #
  # It deliberately has ONE user turn. The whole loop — three research
  # iterations, the handoff to summarize, and the completion into done — has to
  # happen inside it, driven by the agent's own transitions. It previously had
  # four further turns ("continue", "wrap up when ready", "summary please",
  # "thanks") whose only job was to give each state a scripted turn to speak in.
  # With those present the scenario passed whether or not a transition ever
  # produced output, which is exactly the bug it is meant to catch: the state
  # machine advanced and the destination state said nothing.
  turns:
    - role: user
      content: "Please research the PromptKit hook system and summarise."
      assertions:
        - type: tools_called
          params:
            tool_names: ["workflow__set_artifact", "workflow__transition"]

  conversation_assertions:
    # The machine advanced...
    - type: transitioned_to
      params:
        state: summarize
      message: "Research must hand off to summarize once it has enough"
    - type: workflow_complete
      params: {}

    # ...and each destination state actually spoke. These are what fail if the
    # handoff regresses: transitioned_to and workflow_complete are satisfied by
    # a transition that produces no output at all.
    - type: spoke_in_state
      params:
        state: summarize
      message: "summarize must answer within the turn, not wait for a scripted turn"
    - type: spoke_in_state
      params:
        state: done
      message: "done must answer within the turn, not wait for a scripted turn"
