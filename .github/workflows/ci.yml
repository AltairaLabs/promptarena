name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The frontend pulls @altairalabs/atlas from GitHub Packages (private). An
  # explicit permissions block sets every unlisted scope to none, so without
  # this the install 403s even when the package grants this repo read access.
  packages: read

jobs:
  # Detect whether anything outside docs/ changed. The Go pipeline is gated on
  # this so docs-only changes (which have their own Documentation workflow)
  # don't run — or fail — the Go build/lint. A *skipped* required job still
  # satisfies branch protection, unlike a workflow filtered out by `paths`.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      actions: ${{ steps.filter.outputs.actions }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              # Core Go lives in arena/ and packc/. Example packs are NOT part
              # of the shippable module (they're verified by test-examples), so
              # they're deliberately excluded here — an examples-only PR then
              # skips the Go pipeline (a skipped required job still satisfies
              # branch protection). A positive list is used rather than a
              # `!examples/**` negation because dorny/paths-filter ORs patterns
              # (negations don't subtract).
              - 'arena/**/*.go'
              - 'packc/**/*.go'
              - 'tools/**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'sonar-project.properties'
              - 'npm/**'
              # The generated JSON schemas. Build & Test is the only job that
              # runs `schema-gen --check`, so without this a schema-only PR
              # skips the one check that verifies the files were generated
              # rather than hand-edited -- and a skipped required job counts as
              # a pass. #140 got a green tick that way on a hand-edit that
              # fails the check.
              - 'schemas/**'
              - 'arena/agentkb/schemas/**'
              # The web UI is built and tested inside Build & Test (tsc, vite,
              # vitest) and embedded into the Go binary, so a frontend-only
              # change must run that job. Without this a pure frontend PR — a
              # dependency bump, or any .tsx edit — skips build, typecheck and
              # the whole frontend suite, and merges unvalidated.
              - 'arena/web/frontend/**'
              # Changes to this workflow itself must re-run the Go pipeline it
              # defines — otherwise a change to how build/test/coverage/scan run
              # is never exercised before merge.
              - '.github/workflows/ci.yml'
            actions:
              - '.github/actions/**'
            examples:
              - 'examples/**'
              - 'arena/cmd/**'
              - 'schemas/**'
              # The example packs are the integration test for the engine that
              # runs them, so engine and dependency changes must exercise them
              # too. Watching only examples/** meant a dependency bump skipped
              # this job entirely — PromptKit 1.5.5 shipped three breaking API
              # changes in a PATCH release and the example packs never ran.
              - 'arena/**/*.go'
              - 'go.mod'
              - 'go.sum'

  build-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        run: go build ./...
      # Single source of truth for the test run: produce the coverage report
      # here and hand it to the SonarCloud job as an artifact, so the full suite
      # runs once per CI instead of twice. Flags match what Sonar expects
      # (sonar.go.coverage.reportPaths=coverage.out).
      - name: Test (with coverage)
        run: go test ./... -coverprofile=coverage.out -count=1
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 1
      # The hosted JSON schemas (served from promptkit.altairalabs.ai) are
      # generated from arena/arenaconfig + PromptKit/pkg/config. Fail the build
      # if a config-type change didn't regenerate schemas/v1alpha1.
      - name: Schemas up to date
        run: go run ./tools/schema-gen/ --check
      # Frontend (React/TS): build catches type errors via `tsc -b`; the test
      # run produces the lcov report SonarCloud needs for .ts/.tsx coverage.
      # Single source of truth for the frontend suite, same as the Go coverage
      # above — run once here and hand the report to the SonarCloud job.
      # The frontend uses pnpm, and pulls @altairalabs/atlas from GitHub
      # Packages (private), so the install needs a token with read:packages.
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: arena/web/frontend/pnpm-lock.yaml
      # pnpm 10 refuses to expand ${NODE_AUTH_TOKEN} in a *project* .npmrc: that
      # file is committed, so a hostile registry line in it could exfiltrate the
      # secret. It still honours credentials from a trusted source, and the
      # user-level ~/.npmrc is one. Without this pnpm sends no auth header at
      # all and GitHub Packages answers 401 — which is what killed v1.5.7 and
      # every dry run since. The project .npmrc still maps the @altairalabs
      # scope to the registry; only the credential has to move.
      - name: Authenticate to GitHub Packages
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Install frontend dependencies
        run: pnpm --dir arena/web/frontend install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir arena/web/frontend build
      - name: Test frontend (with coverage)
        run: pnpm --dir arena/web/frontend test:ci
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: arena/web/frontend/coverage/lcov.info
          retention-days: 1

  npm-wrappers:
    name: Test npm wrappers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [promptarena, packc]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: npm/${{ matrix.pkg }}/package-lock.json
      # No --omit=optional. It used to be set to keep the job off the ~46MB of
      # per-platform binary packages, but those are pinned at a version that was
      # never published, so npm skips them and they are absent from both
      # lockfiles -- `npm ci` never downloads them either way. What the flag
      # DID strip is unrs-resolver's native binding (also an optional dep),
      # which jest-resolve >= 30.5.0 needs: without it module resolution returns
      # null and jest dies resolving its own default testRunner. The unit tests
      # inject a stub binary rather than exec a real one, so nothing here
      # depends on the platform packages staying uninstalled.
      - name: Install
        run: npm ci --prefix npm/${{ matrix.pkg }}
      - name: Lint
        run: npm run lint --prefix npm/${{ matrix.pkg }}
      - name: Test (with coverage)
        run: npm run test:ci --prefix npm/${{ matrix.pkg }}
      # sonar-project.properties points sonar.javascript.lcov.reportPaths at
      # npm/*/coverage/lcov.info. Nothing used to generate those files, so the
      # wrapper code was reported to SonarCloud as entirely uncovered.
      - name: Upload wrapper coverage report
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.pkg }}-coverage
          path: npm/${{ matrix.pkg }}/coverage/lcov.info
          retention-days: 1

  lint:
    name: Lint (new code)
    # Inherited baseline: lint only NEW code on PRs. The extracted arena/packc
    # carry pre-existing findings grandfathered from PromptKit; hold new work to
    # standard without blocking on the inherited debt.
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # v7 installs golangci-lint v2, matching the repo's `version: "2"`
      # .golangci.yml. v6 pins golangci-lint v1 (1.64.x), which rejects the v2
      # config and refused to run against go.mod's `go 1.26.0`.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true

  sonarcloud:
    name: SonarCloud
    # Reuse the coverage report produced by build-test rather than re-running the
    # whole suite: the SonarGo analyzer parses sources directly and only needs
    # coverage.out, so no Go toolchain / build / test step is required here.
    needs: [changes, build-test, npm-wrappers]
    # Neither dependabot PRs nor PRs from forks can access secrets, so the scan
    # has no SONAR_TOKEN and fails at auth ("Not authorized or project not
    # found"). That is a GitHub restriction, not something Sonar can be
    # configured around, and it made SonarCloud -- a required check -- literally
    # unsatisfiable for every external contribution. Build & Test and
    # Lint (new code) need no secrets and are required in its place; Sonar still
    # runs on push to main, so a regression from a merged fork PR surfaces
    # there. `github.event.pull_request` is null on push, so main still scans.
    if: >-
      needs.changes.outputs.code == 'true'
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: go-coverage
      - name: Download frontend coverage report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: arena/web/frontend/coverage/
      - name: Download npm wrapper coverage reports
        uses: actions/download-artifact@v8
        with:
          name: npm-promptarena-coverage
          path: npm/promptarena/coverage/
      - name: Download npm packc coverage report
        uses: actions/download-artifact@v8
        with:
          name: npm-packc-coverage
          path: npm/packc/coverage/
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docs-urls:
    name: Check Arena doc URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No links to the retired promptkit.altairalabs.ai/arena docs
        # Arena's docs moved to promptarena.altairalabs.ai in the repo
        # extraction; the old /arena/ paths on the PromptKit host 404 (#101).
        # Only the /arena/ prefix moved — promptkit.altairalabs.ai/schemas/...
        # is deliberately kept for schema URL stability, and PromptKit's own
        # doc pages are correctly cross-linked — so this pattern is
        # deliberately narrow. The docs link checker can't catch these because
        # it skips external URLs in CI.
        run: |
          # ci.yml excludes itself — the pattern below is a literal match for
          # itself. local-backlog holds design docs that record the old URLs
          # as history.
          if grep -rn 'promptkit\.altairalabs\.ai/arena' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
               --exclude-dir=.astro --exclude-dir=local-backlog \
               --exclude-dir=.superpowers --exclude=ci.yml . ; then
            echo "::error::Found links to the retired promptkit.altairalabs.ai/arena docs — use https://promptarena.altairalabs.ai/arena/ (or a root-relative /arena/... link inside docs/src)."
            exit 1
          fi
          echo "No retired Arena doc URLs found."

  test-actions:
    name: Test GitHub Actions (TypeScript)
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: [promptarena-action, packc-action]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/actions/${{ matrix.action }}/package-lock.json
      - name: Install dependencies
        working-directory: .github/actions/${{ matrix.action }}
        run: npm ci
      - name: Lint
        working-directory: .github/actions/${{ matrix.action }}
        run: npm run lint
      - name: Test
        working-directory: .github/actions/${{ matrix.action }}
        run: npm test

  test-examples:
    name: Test example packs
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    env:
      # Validate against the in-repo schema snapshots (matches the runtime the
      # packs ship against) rather than the published remote schemas.
      PROMPTKIT_SCHEMA_SOURCE: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build promptarena
        run: go build -o bin/promptarena ./arena/cmd/promptarena

      - name: Validate every example config against the schemas
        run: |
          FAILED=0; TOTAL=0
          while IFS= read -r cfg; do
            TOTAL=$((TOTAL+1))
            if ! ./bin/promptarena validate "$cfg" --schema-only >/dev/null 2>&1; then
              echo "::error::$cfg failed schema validation"
              ./bin/promptarena validate "$cfg" --schema-only 2>&1 | grep -iE 'error|❌' | head -5
              FAILED=$((FAILED+1))
            fi
          done < <(find examples -maxdepth 2 \( -name 'config.arena.yaml' -o -name '*.arena.yaml' -o -name 'arena.yaml' \) -not -path '*/out/*' | sort)
          echo "Validated $TOTAL config(s); $FAILED failed."
          [ $FAILED -eq 0 ]

      - name: Mock-run the showcase examples
        run: |
          set -e
          run() { local ex="$1"; shift; echo "=== $ex ==="; ( cd "examples/$ex" && ../../bin/promptarena run "$@" ); }
          run customer-support  --config config.arena.yaml --ci --mock-provider --mock-config mock-responses.yaml --scenario customer-support-scenarios --formats json
          run multimodal-basics --config config.arena.yaml --ci --mock-provider --mock-config mock-responses.yaml --formats json
          run variables-demo    --config config.arena.yaml --ci --mock-provider --mock-config mock-config.yaml --formats json
          run assertions-test   --config config.arena.yaml --ci --mock-provider --mock-config mock-responses.yaml --formats json
          run llm-judge         --config config.arena.yaml --ci --formats json
          run guardrails-test   --config config.arena.yaml --ci --formats json
          run eval-test         --config config.arena.yaml --ci --formats json
          run document-analysis --config config.arena.yaml --ci --formats json

          # Workflow examples. These were previously schema-validated only, so
          # nothing executed them and a broken one could land on main — which is
          # how workflow-skills sat with every skill__activate refused, and how
          # the agent-loops mocks kept emitting an event invalid for the state
          # they had reached. They exercise the most intricate machinery in the
          # repo (state handoff mid-turn, per-state skill filtering, max-visits
          # redirects), so they are the last examples that should go unrun.
          #
          # No --mock-provider: each declares mock_config on its provider, and
          # the flag replaces the assistant content wholesale, which would
          # discard the scripted tool calls the workflows are driven by.
          run voice-ivr                 --config config.arena.yaml --ci --formats json
          run workflow-agent-loops      --config config.arena.yaml --ci --formats json
          run workflow-order-processing --config config.arena.yaml --ci --formats json
          run workflow-skills           --config config.arena.yaml --ci --formats json
          run workflow-support          --config config.arena.yaml --ci --formats json
