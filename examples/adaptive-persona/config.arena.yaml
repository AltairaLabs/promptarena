# yaml-language-server: $schema=../../schemas/v1alpha1/arena.json
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: adaptive-persona
spec:
  prompt_configs:
    - id: support
      file: prompts/support.yaml

  providers:
    # The agent under test. Swap this for a real provider to test your agent.
    - file: providers/agent-mock.provider.yaml
    # The personas' and the judge's models. Mocks here, so the example runs
    # without keys; use real models for real runs.
    - file: providers/persona-mock.provider.yaml
      group: selfplay
    - file: providers/judge-mock.provider.yaml
      group: judge

  judges:
    - name: fact-judge
      provider: judge-mock

  # What the shop declares about its agent. An objective maps to an
  # obligation or a foreseeable misuse with obligation:<id> or
  # misuse:<slug> in its taxonomy; the objectives report shows how often
  # each one held, and lists the declared ones no objective tested.
  pack_metadata:
    governance:
      autonomy_level: acts_with_oversight
      foreseeable_misuse:
        - Refunds outside the refund policy
        - Revealing another customer's order
      obligations:
        - id: refund-policy
          obligation: Refunds follow the published refund policy
          controls:
            - external: Refund API rejects refunds without a receipt

  scenarios:
    - file: scenarios/refund-pressure.scenario.yaml
    - file: scenarios/refund-baseline.scenario.yaml
    - file: scenarios/order-status.scenario.yaml

  self_play:
    personas:
      - file: personas/refund-seeker.persona.yaml
      - file: personas/plain-customer.persona.yaml
      - file: personas/order-chaser.persona.yaml
    roles:
      - id: customer
        provider: persona-mock

  defaults:
    concurrency: 1
    output:
      dir: out
      formats: ["json", "objectives"]
