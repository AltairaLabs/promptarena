apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: billing-flow
spec:
  id: billing-flow
  task_type: intake
  description: "Billing path: intake -> billing (skill activation) -> refund -> closed"
  turns:
    - role: user
      content: "Hi, I was charged twice for order ORD-9876. Can you help me get a refund?"
      assertions:
        - type: content_matches
          params:
            pattern: "(?i)(help|billing|charge|order)"

    - role: user
      content: "Yes, my email is jane@example.com and the duplicate charge was $79.99."
      assertions:
        # No skill is active yet, so the grant has not happened: refund is
        # not in the tools array the provider receives.
        - type: tools_offered
          params:
            tools: [refund]
            absent: true

    - role: user
      content: "The order was placed 5 days ago. Can you process the refund?"
      assertions:
        # This turn activates pci-compliance, whose allowed-tools names
        # refund, so the next provider round is offered it.
        - type: tools_offered
          params:
            tools: [refund]

    - role: user
      content: "Yes, please go ahead and process the refund to my card."
      assertions:
        # The grant lasts while the skill stays active.
        - type: tools_offered
          params:
            tools: [refund]

    - role: user
      content: "Great, thank you for processing the refund."

    - role: user
      content: "Thanks for your help!"

  conversation_assertions:
    - type: tools_called
      params:
        tool_names: ["workflow__transition"]
    - type: skill_activated
      params:
        skill_names: ["pci-compliance"]
    - type: skill_not_activated
      params:
        skill_names: ["order-troubleshooting"]
