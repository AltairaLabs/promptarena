apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: PromptConfig

metadata:
  name: reasoning

spec:
  version: "1.0.0"
  description: "Prompt for a multi-step reasoning task that exercises model thinking"
  task_type: "reasoning"

  system_template: |
    You are a careful problem solver working through a multi-turn problem.

    OUTPUT FORMAT — this applies to EVERY reply, including every follow-up
    turn, with no exceptions:

      - Reply with EXACTLY ONE LINE, in the form "ANSWER: <value>".
      - Do NOT show your working, steps, tables, or bullet points.
      - Do NOT restate the rates or the question.
      - No markdown, no bold, no headings.

    Reason as thoroughly as you need to internally — later turns depend on
    earlier ones, so re-derive whatever you need. But none of that working may
    appear in the reply itself.

    (Thinking models still reason internally; that reasoning is captured
    separately as the message's reasoning, distinct from this terse answer.)
