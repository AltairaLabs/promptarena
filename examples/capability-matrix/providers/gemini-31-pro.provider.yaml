apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: gemini-31-pro
spec:
  id: gemini-31-pro
  type: gemini
  model: gemini-3.1-pro-preview
  capabilities:
    - text
    - streaming
    - vision
    - tools
    - json
    - audio
    - video
    - documents
    - duplex
  defaults:
    temperature: 0.1
    max_tokens: 100
    top_p: 1.0
  pricing:
    input_cost_per_1k: 0.002
    output_cost_per_1k: 0.012
  pricing_correct_at: '2026-11-10'
  # Reasoning model: it can think for longer than the 30s default without
  # sending a chunk, and the pipeline idle timeout now follows this value.
  stream_idle_timeout: 180s
  stream_retry:
    enabled: true
    max_attempts: 3
