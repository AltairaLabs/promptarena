apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Arena
metadata:
  name: codegen-sandbox-arena
  annotations:
    description: |
      Agent doing codegen in a Docker-provisioned sandbox.

      Run it (needs Docker; no API key, the provider is a mock):
        make build-go
        docker pull ghcr.io/altairalabs/codegen-sandbox:latest
        cd examples/codegen-sandbox
        ../../bin/promptarena run --ci --format markdown

      The tool calls run for real in the sandbox container, so
      --mock-provider still starts it.

spec:
  prompt_configs:
    - id: codegen-agent
      file: prompts/codegen-agent.yaml

  providers:
    - file: providers/mock-provider.yaml

  scenarios:
    - file: scenarios/simple-fix.scenario.yaml

  mcp_servers:
    - name: sandbox
      source: docker
      scope: session
      source_args:
        image: ghcr.io/altairalabs/codegen-sandbox:latest
        env:
          DEV_MODE: "1"

  # Mounted read-only into the sandbox at /skills/codegen.
  skills:
    - path: skills/codegen
      preload: true

  defaults:
    temperature: 0.1
    max_tokens: 512
    output:
      dir: out
      formats: ["json", "markdown"]
