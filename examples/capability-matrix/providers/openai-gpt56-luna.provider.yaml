apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: openai-gpt56-luna
spec:
  id: openai-gpt56-luna
  type: openai
  # The 5.6 generation ships as three same-day siblings — luna, sol and terra —
  # with no bare gpt-5.6 alias between them. Probed live, all three describe
  # themselves as general purpose and none is documented as the mainline, so one
  # is carried here to represent the generation's capabilities rather than all
  # three at triple the weekly spend. Swapping to sol or terra is a one-line
  # change if the family turns out to be differentiated.
  model: gpt-5.6-luna
  capabilities:
    - text
    - streaming
    - vision
    - tools
    - json
  unsupported_params:
    - temperature
    - top_p
  additional_config:
    # gpt-5.6 rejects function tools on /v1/chat/completions whenever a
    # reasoning effort is in play: "Function tools with reasoning_effort are not
    # supported ... use /v1/responses or set reasoning_effort to 'none'". The
    # Responses API is the forward path, and is what the -pro models already
    # select automatically.
    api_mode: responses
  defaults:
    temperature: 0.1
    max_tokens: 100
    top_p: 1.0
  pricing:
    input_cost_per_1k: 0.00125
    output_cost_per_1k: 0.01
  stream_retry:
    enabled: true
    max_attempts: 3
