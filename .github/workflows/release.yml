name: Release

# Releases are cut from the Actions tab, not by pushing a tag.
#
#   gh workflow run release.yml -f version=v1.5.8
#   gh workflow run release.yml -f version=v1.5.8 -f dry_run=true   # validate only
#
# The tag is created by this workflow AFTER a full snapshot build succeeds,
# rather than being the thing that starts it. That ordering is the point: a
# tag-triggered release publishes its version number before anything has been
# checked, so a failure burns that version — the Go module proxy caches the tag
# within seconds and it can never point anywhere else. Every failed release used
# to leave an orphaned tag behind for exactly this reason.
#
# The snapshot build in `validate` runs the real thing: goreleaser's before-hooks
# (which install and build the embedded web UI from a private registry) and every
# cross-compile, with publishing disabled. That is what catches environment drift
# — a missing token or permission — before a version number is spent on it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, including the v (e.g. v1.5.8)'
        required: true
        type: string
      dry_run:
        description: 'Validate only: run the full snapshot build, create no tag and publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create tags and GitHub releases
  # The embedded web UI pulls @altairalabs/atlas from GitHub Packages, and
  # goreleaser's before-hook installs it. An explicit permissions block sets
  # every unlisted scope to none, so this read has to be named. It is necessary
  # but not sufficient — the install also needs NODE_AUTH_TOKEN below, because
  # atlas belongs to a different repository than this one.
  packages: read

jobs:
  validate:
    name: Validate (snapshot build, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A tag that already exists cannot be reused: the module proxy has it
      # pinned to whatever commit it pointed at first. Fail here rather than
      # discovering it after the build.
      - name: Version is unused
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists — pick the next version"
            exit 1
          fi
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          echo "previous release: ${PREV:-none}"
          if [ -n "$PREV" ] && [ "$(printf '%s\n%s\n' "$PREV" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not greater than the latest tag $PREV"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The real release path with publishing switched off: before-hooks, every
      # cross-compile, archives. Anything that would fail the release fails here,
      # while the version is still unspent.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Test
        run: go test ./... -count=1

  tag:
    name: Tag ${{ inputs.version }}
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

  goreleaser:
    name: GoReleaser (binaries + GitHub release + Homebrew)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      # Check out the tag itself: goreleaser derives the version from the git
      # state, so it has to be standing on the tag it is releasing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      # Node + pnpm are needed by goreleaser's before-hooks, which build the
      # embedded Arena web UI (arena/web/frontend) so `promptarena serve` isn't
      # a blank page in released binaries.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@10
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew cask push to AltairaLabs/homebrew-tap
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # goreleaser's before-hook runs `pnpm install` for the embedded web UI,
          # which resolves @altairalabs/atlas from GitHub Packages. The frontend's
          # .npmrc reads ${NODE_AUTH_TOKEN}. GITHUB_TOKEN is not enough here:
          # packages:read only covers packages owned by this repository, and
          # atlas is published from another one. NODE_AUTH_TOKEN is the
          # organisation secret that grants the cross-repo read.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

  npm-publish:
    name: npm publish
    needs: goreleaser
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [promptarena, packc]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Set version
        working-directory: npm/${{ matrix.pkg }}
        run: |
          VERSION="${{ inputs.version }}"
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Publish
        working-directory: npm/${{ matrix.pkg }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  major-tag:
    name: Update floating major tag (for @vN action refs)
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      # Consumers reference the composite actions as
      # AltairaLabs/promptarena/.github/actions/<name>@v1. Move the floating
      # major tag (v1) to this release so that ref keeps resolving. This tag is
      # co-located with the latest vX.Y.Z release commit, so Go ignores it
      # (not a complete semver version) and GoReleaser changelogs are unaffected.
      - name: Move major tag to this release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ inputs.version }}"
          MAJOR="${VERSION%%.*}"   # v1.5.8 -> v1
          git tag -fa "$MAJOR" -m "Release $VERSION"
          git push origin "$MAJOR" --force
