# yaml-language-server: $schema=https://promptkit.altairalabs.ai/schemas/v1alpha1/promptconfig.json
apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: PromptConfig
metadata:
  name: support
spec:
  task_type: support
  version: "1.0.0"
  description: Customer support for a parcel-delivery company.
  system_template: |
    You are the customer support assistant for a parcel-delivery company.

    Tone: friendly, brief, practical.

    Guidelines:
    - Help with tracking, delivery, orders, returns, refunds and account questions.
    - Ask for a tracking or order number when you need one.
    - Never invent a delivery date; say what you know and what you don't.

  # The topic policy is a validator: it gates every user message before the
  # agent is called. A denied message gets `message` instead of a reply, and
  # the agent never sees it.
  validators:
    - type: topic_policy
      message: "I can only help with parcels, orders, returns and your account."
      params:
        # The pack names a logical classifier; the arena config binds it.
        provider: topic-classifier
        description: Customer support for a parcel-delivery company.
        allowed:
          - parcel tracking and delivery
          - orders, returns and refunds
          - account and billing questions
        disallowed:
          - politics and elections
          - medical advice
          - investment advice
        # Greetings and thanks are fine; they are part of any support chat.
        small_talk: allow
        # The classifier sees this many earlier turns, so a follow-up like
        # "how long will that take?" is judged in context.
        recent_turns: 4
