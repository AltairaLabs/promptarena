version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-local
    ports:
      - "8000:8000"
    # Required. vllm/vllm-openai is built against CUDA and cannot start without
    # an NVIDIA GPU. Leaving this out does not fall back to CPU — the container
    # exits with "Failed to infer device type" after pulling the 22.5GB image.
    # On a host with no NVIDIA GPU, use examples/ollama-local/ instead.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Optional: Set HuggingFace token for gated models
      # - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VLLM_ALLOW_RUNTIME_LORA=false
    command:
      - --model
      - facebook/opt-125m  # Small model for testing (~250MB)
      # For production, use larger models:
      # - meta-llama/Llama-2-7b-chat-hf
      # - mistralai/Mistral-7B-Instruct-v0.1
      - --dtype
      - auto
      # There is no CPU mode with this image. `--device cpu` is accepted as a
      # flag but the CUDA-only build still fails to infer a device and exits 1.
      # CPU inference needs an image built from upstream's Dockerfile.cpu, and
      # arm64 CPU support there is still experimental.
      # Uncomment for better GPU utilization
      # - --gpu-memory-utilization
      # - "0.9"
      # Uncomment for tensor parallelism (multi-GPU)
      # - --tensor-parallel-size
      # - "2"
    volumes:
      # Cache HuggingFace models locally
      - vllm-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  vllm-models:
    driver: local
