# Mock LLM responses for the agent-loops example.
#
# Each numbered entry is one LLM response, indexed by response number and NOT by
# scenario turn. A single scenario turn consumes as many as the tool loop asks
# for: a response carrying tool calls is followed by another round once the
# results come back, and the turn ends at the first response with no tool calls.
#
# A workflow__transition now takes effect within the turn that issued it — the
# destination state renders and answers on the very next round, without waiting
# for another user message (PromptKit#1747, promptarena#109). Both scenarios
# below therefore run their whole loop from one opening user turn, and each
# response must be valid for the state the run will ACTUALLY be in by the time
# it is consumed. An event belonging to a state the run has already left is
# rejected by that run's state machine.

scenarios:
  # Converges: research iterates to its cap of useful work, hands off to
  # summarize, and completes — all inside the opening turn.
  #
  #   R1 research(v1) --More--> research(v2)
  #   R2 research(v2) --More--> research(v3)
  #   R3 research(v3) --Done--> summarize
  #   R4 summarize    --Complete--> done
  #   R5 done: plain text, no tool calls, so the turn ends here.
  loop-converges:
    turns:
      1:
        response: "Gathering the first piece of information."
        tool_calls:
          - name: workflow__set_artifact
            arguments:
              name: findings
              value: "Note 1: The library exposes a hook registry with four interface types."
          - name: workflow__transition
            arguments:
              event: More
              context: "Recorded note 1"

      2:
        response: "Gathering a second piece of information."
        tool_calls:
          - name: workflow__set_artifact
            arguments:
              name: findings
              value: "Note 2: EvalHook differs from the others: purely observational, may mutate result in place."
          - name: workflow__transition
            arguments:
              event: More
              context: "Recorded note 2"

      3:
        response: "I have what I need — moving to summarise."
        tool_calls:
          - name: workflow__set_artifact
            arguments:
              name: findings
              value: "Note 3: Hooks are registered via sdk.WithProviderHook / WithToolHook / WithSessionHook / WithEvalHook."
          - name: workflow__transition
            arguments:
              event: Done
              context: "Recorded note 3 and leaving research"

      # Now in `summarize`: the destination state speaks for itself rather than
      # waiting for a scripted turn. Complete is summarize's only event.
      4:
        response: "Summary prepared; marking complete."
        tool_calls:
          - name: workflow__transition
            arguments:
              event: Complete
              context: "Summary written based on the three notes"

      # Terminal `done`. No tool calls, so this response ends the turn.
      5: "PromptKit exposes four hook interfaces (Provider, Tool, Session, Eval), registered via the matching sdk.With*Hook options; EvalHook is observational and can mutate its result in place."

  # Hits the cap: the agent keeps asking for another iteration until
  # max_visits on `research` forces a redirect to `summarize`. The redirect is
  # the runtime's decision, not the agent's — the response that triggers it
  # still asks for More.
  loop-hits-max-visits:
    turns:
      1:
        response: "Iteration 1 — gathering a note."
        tool_calls:
          - name: workflow__set_artifact
            arguments:
              name: findings
              value: "Note 1"
          - name: workflow__transition
            arguments:
              event: More
              context: "it 1"

      2:
        response: "Iteration 2 — gathering a note."
        tool_calls:
          - name: workflow__set_artifact
            arguments:
              name: findings
              value: "Note 2"
          - name: workflow__transition
            arguments:
              event: More
              context: "it 2"

      # This More exceeds max_visits on `research`, so the runtime redirects to
      # `summarize` and emits workflow.max_visits_exceeded with
      # redirected=true / original_target=research.
      3:
        response: "Iteration 3 — gathering a note."
        tool_calls:
          - name: workflow__set_artifact
            arguments:
              name: findings
              value: "Note 3"
          - name: workflow__transition
            arguments:
              event: More
              context: "it 3 — will be redirected"

      # Redirected into `summarize`, whose only event is Complete. Asking for
      # More here would be invalid for the state the run is now in.
      4:
        response: "Summarising with whatever findings accumulated before the cap."
        tool_calls:
          - name: workflow__transition
            arguments:
              event: Complete
              context: "Cap-driven summary"

      5: "After the research iterations, the workflow engine stopped further attempts and produced this summary."
