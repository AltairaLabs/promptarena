apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Template
metadata:
  name: multimodal
  labels:
    version: "1.0.0"
  annotations:
    description: "Multimodal AI testing for image, audio, and video processing"
    author: "AltairaLabs"
    tags: "multimodal,vision,audio,image,video"
    
spec:
  variables:
    - name: project_name
      description: "Project name"
      type: string
      default: "multimodal-tests"
      required: true
      prompt: "Project name"
      
    - name: providers
      description: "LLM providers to configure (must support multimodal)"
      type: array
      options: ["mock", "openai", "claude", "gemini"]
      default: ["openai"]
      prompt: "Which providers would you like to test"
      
    - name: media_types
      description: "Types of media to test"
      type: array
      options: ["image", "audio", "video"]
      default: ["image"]
      prompt: "Which media types"
      
    - name: include_env
      description: "Create .env file for API keys"
      type: boolean
      default: true
      
  files:
    - path: "config.arena.yaml"
      template: "templates/arena.yaml.tmpl"
      
    - path: "prompts/vision-analyst.prompt.yaml"
      template: "templates/prompt-vision.yaml.tmpl"
      
    - path: "providers/{{.provider}}.provider.yaml"
      template: "templates/provider.yaml.tmpl"
      foreach: "providers"
      
    - path: "scenarios/image-analysis.scenario.yaml"
      template: "templates/scenario-image.yaml.tmpl"
      
    - path: "scenarios/image-comparison.scenario.yaml"
      template: "templates/scenario-comparison.yaml.tmpl"
      
    - path: "media/red-square.png"
      template: "media/red-square.png"
      raw: true

    - path: "media/blue-circle.png"
      template: "media/blue-circle.png"
      raw: true

    - path: "media/README.md"
      content: |
        # Media Files

        Test media referenced by the scenarios. Paths in a scenario's
        `media.file_path` resolve relative to `config.arena.yaml`.

        Shipped fixtures:
        - `red-square.png`: a red square on a white background
        - `blue-circle.png`: a blue circle on a white background

        Add your own files alongside them:
        - Images: .jpg, .png, .gif, .webp
        - Audio: .mp3, .wav (if testing audio)
        - Video: .mp4, .webm (if testing video)

    - path: "mock-responses.yaml"
      template: "templates/mock-responses.yaml.tmpl"
      condition: "{{range .providers}}{{if eq . \"mock\"}}true{{end}}{{end}}"

    - path: ".env"
      template: "templates/env.tmpl"
      condition: "{{.include_env}}"
      
    - path: ".gitignore"
      content: |
        .env
        out/
        *.log
        .DS_Store
        
    - path: "README.md"
      template: "templates/readme.md.tmpl"
      
  examples:
    scenarios:
      - "Image description"
      - "Object detection"
      - "Image comparison"
      - "OCR and text extraction"
    providers:
      - "openai"
      - "claude"
      - "gemini"
      
  docs:
    getting_started: "https://promptarena.altairalabs.ai/arena/tutorials/01-first-test"
    api_reference: "https://promptarena.altairalabs.ai/arena/reference"
