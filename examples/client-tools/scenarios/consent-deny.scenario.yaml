apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: consent-deny
spec:
  id: consent-deny
  task_type: chat
  description: "Verifies that the LLM handles consent denial gracefully"

  turns:
    - role: user
      content: "Where am I right now?"
      consent_overrides:
        get_location: deny
      assertions:
        # tools_called counts only calls that succeeded, and a denied call
        # fails by design, so the attempt is counted with tool_call_count.
        - type: tool_call_count
          params:
            tool: get_location
            min: 1
          message: "Should attempt to call get_location tool"

    - role: user
      content: "Can you try again?"
      assertions:
        - type: content_matches
          params:
            pattern: "(?i)(unable|denied|provide|manually|sorry)"
          message: "Should explain that location access was denied and suggest alternatives"
