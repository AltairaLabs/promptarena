apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Scenario
metadata:
  name: handoff-to-agent
spec:
  id: handoff-to-agent
  task_type: verifying
  description: "Caller requests a human: verifying -> handoff"

  turns:
    - role: user
      content: "Hello, I think someone made an unauthorised charge on my account."
      assertions:
        - type: state_is
          params:
            state: verifying

    - role: user
      content: "Yes, my account is ACC-12345."
      assertions:
        - type: transitioned_to
          params:
            state: handoff

  conversation_assertions:
    - type: tools_called
      params:
        tool_names: ["lookup_account"]
        min_calls: 1
      message: "Agent must verify identity before any other action"
    - type: tools_called
      params:
        tool_names: ["transfer_to_agent"]
        min_calls: 1
      message: "Agent must call transfer_to_agent for human-handoff scenarios"
    - type: tools_not_called
      params:
        tool_names: ["check_balance"]
      message: "Agent must NOT call check_balance when caller requests human handoff"
    - type: workflow_complete
      params: {}
    - type: workflow_transition_order
      params:
        sequence: ["handoff"]
    # transitioned_to above only proves the machine advanced. It is satisfied
    # by a transition that produces no output at all, which is exactly the bug
    # PromptKit#1747 fixed. This asserts the handoff agent actually replied.
    #
    # There is deliberately no scripted turn after the transition: the handoff
    # state has to answer within the transitioning turn. A trailing "Thank you,
    # I'll hold." used to provide one, and with it present this assertion
    # passed whether or not the handoff was wired at all.
    - type: spoke_in_state
      params:
        state: handoff
      message: "Handoff state must actually respond, not just be entered"
