apiVersion: promptkit.altairalabs.ai/v1alpha1
kind: Provider
metadata:
  name: anthropic-fable52
spec:
  id: anthropic-fable52
  type: claude
  model: claude-fable-5-2
  capabilities:
    - text
    - streaming
    - vision
    - tools
    - json
    - documents
  # Claude Opus 4.7+ deprecated the temperature parameter (API returns 400 if
  # sent). The Claude provider drops params listed here before the request.
  unsupported_params:
    - temperature
  defaults:
    # temperature is required by the schema; unsupported_params strips it from
    # the request so Claude 4.7+ (which rejects it) never receives it.
    temperature: 0.1
    top_p: 1.0
    max_tokens: 100
  pricing:
    input_cost_per_1k: 0.008
    output_cost_per_1k: 0.04
  pricing_correct_at: '2026-11-10'
  stream_retry:
    enabled: true
    max_attempts: 3
