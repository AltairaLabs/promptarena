name: Documentation

# - PRs touching docs/: build + internal link check (no deploy).
# - Push to main touching docs/: rebuild the current version and deploy,
#   preserving any archived versions already live.
# - Release tags (vX.Y.Z): archive the outgoing minor if the minor changed,
#   then deploy the new current alongside all archives.
# - workflow_dispatch: manual redeploy.
on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Only deploys share 'pages'. A PR build never deploys, so it gets its own group
# per branch; otherwise parallel docs PRs cancel each other's pending runs (and
# could cancel main's pending deploy).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://promptarena.altairalabs.ai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Astro 6 requires Node >= 22.12.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      # Cached so a GitHub release-download outage (504s and dropped
      # connections, seen 2026-11-08) does not fail the docs build once the
      # binary has been fetched for this version.
      - name: Cache D2
        id: d2-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/d2
          key: d2-v0.7.1-linux-amd64

      - name: Install D2
        # Download the pinned release tarball directly. The upstream
        # install.sh queries api.github.com unauthenticated, and the shared
        # runner IPs hit its rate limit (curl 403) often enough to fail the
        # docs build. Release asset downloads aren't rate-limited that way.
        # Pinned so an upstream release cannot break the docs build without
        # us choosing to move; bump the cache key above with it.
        if: steps.d2-cache.outputs.cache-hit != 'true'
        env:
          D2_VERSION: v0.7.1
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$RUNNER_TEMP/d2.tar.gz" \
            "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/d2.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/d2"
          install -m 0755 "$RUNNER_TEMP/d2-${D2_VERSION}/bin/d2" "$HOME/.local/d2/d2"

      - name: Add D2 to PATH
        run: echo "$HOME/.local/d2" >> "$GITHUB_PATH"

      - name: Verify D2
        run: d2 --version

      - name: Install dependencies
        working-directory: docs
        # The committed lock is generated on macOS and omits Linux-only native
        # optional deps (rollup/esbuild) — npm's optional-dependency bug
        # (npm/cli#4828). npm's own guidance is to drop the lock and reinstall
        # so it resolves the runner's platform binaries; package.json pins keep
        # the versions in range.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
        env:
          # @altairalabs/brand (the masterbrand family bar) is a private
          # GitHub Packages dependency; docs/.npmrc reads this. secrets.GITHUB_TOKEN
          # cannot be used — it is scoped to this repo and cannot read another
          # repository's packages. Needs `read:packages`.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Check Mermaid diagrams
        # Mermaid renders in the browser, so the build cannot catch a broken
        # diagram. See docs/STYLE.md "Diagrams".
        working-directory: docs
        run: npm run check:mermaid

      # --- Release only: work out whether the minor changed and, if so, build
      # the outgoing minor from its last tag at a /vX-Y/ base path. ---
      - name: Determine archive
        id: archive-check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NEW_VERSION="${GITHUB_REF_NAME#v}"
          NEW_MINOR="$(echo "$NEW_VERSION" | cut -d. -f1-2)"
          LIVE=$(curl -sf "${SITE_URL}/versions.json" || echo '{"current":null}')
          CURRENT_MINOR=$(echo "$LIVE" | jq -r '.current.version // empty')
          echo "Live current minor: ${CURRENT_MINOR:-none}; new minor: $NEW_MINOR"
          if [ -n "$CURRENT_MINOR" ] && [ "$CURRENT_MINOR" != "$NEW_MINOR" ]; then
            ARCHIVE_TAG=$(git tag -l "v${CURRENT_MINOR}.*" | sort -V | tail -1)
            echo "needs_archive=true" >> "$GITHUB_OUTPUT"
            echo "archive_minor=$CURRENT_MINOR" >> "$GITHUB_OUTPUT"
            echo "archive_tag=$ARCHIVE_TAG" >> "$GITHUB_OUTPUT"
            echo "archive_path=v${CURRENT_MINOR//./-}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_archive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archived version
        if: steps.archive-check.outputs.needs_archive == 'true'
        run: |
          TAG="${{ steps.archive-check.outputs.archive_tag }}"
          BASE="/${{ steps.archive-check.outputs.archive_path }}"
          if [ -z "$TAG" ]; then
            echo "No tag found for outgoing minor — skipping archive build."
            exit 0
          fi
          git worktree add ../archive-src "$TAG"
          if [ ! -d ../archive-src/docs ]; then
            echo "Tag $TAG predates the docs site — nothing to archive."
            exit 0
          fi
          rm -f ../archive-src/docs/package-lock.json
          npm --prefix ../archive-src/docs install --no-audit --no-fund
          ( cd ../archive-src/docs && BASE_PATH="$BASE" npm run build )
          mv ../archive-src/docs/dist "archive-${{ steps.archive-check.outputs.archive_path }}"
          echo "Archived docs for $TAG at ${BASE}/"
        # The outgoing minor's docs install the same private @altairalabs
        # packages and fetch the same adapter docs as the current build, so
        # they need the same credentials. This step never ran until v2.1.0
        # (releases never reached this workflow before), and failed 401.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Download existing archives from live site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p existing-archives
          LIVE=$(curl -sf "${SITE_URL}/versions.json" || echo '{"archived":[]}')
          for p in $(echo "$LIVE" | jq -r '.archived[].path // empty' | sed 's|^/||;s|/$||'); do
            [ -z "$p" ] && continue
            echo "Mirroring existing archive: $p"
            mkdir -p "existing-archives/$p"
            wget -q -r -np -nH --cut-dirs=1 -P "existing-archives/$p" "${SITE_URL}/$p/" || true
          done

      # The committed versions.json is only a seed: release builds update it
      # inside the runner and never commit it back. Without this, every push to
      # main redeployed the seed (v1.5.6, no archives) over whatever the last
      # release had published. Start from the live copy so the archive list
      # survives, and on non-release builds point "current" at the latest
      # stable tag.
      - name: Sync versions.json from the live site
        if: github.event_name != 'pull_request'
        run: |
          LIVE=$(curl -sf "${SITE_URL}/versions.json" || true)
          if [ -n "$LIVE" ] && echo "$LIVE" | jq -e '.current' >/dev/null; then
            echo "$LIVE" | jq '.["$schema"] = "./versions.schema.json"' > docs/versions.json
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            exit 0
          fi
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          CURRENT=$(jq -r '.current.fullVersion // empty' docs/versions.json)
          if [ -n "$LATEST" ] && [ "${LATEST#v}" != "$CURRENT" ]; then
            echo "Live site says ${CURRENT:-nothing}; latest release is $LATEST"
            node docs/scripts/update-versions.cjs "$LATEST" false
          else
            jq '.["$schema"] = "https://promptarena.altairalabs.ai/versions.schema.json"' \
              docs/versions.json > docs/public/versions.json
          fi

      - name: Update versions.json (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: docs
        run: |
          NEW_VERSION="${GITHUB_REF_NAME#v}"
          IS_PRERELEASE=false
          [[ "$NEW_VERSION" == *-* ]] && IS_PRERELEASE=true
          node scripts/update-versions.cjs \
            "$NEW_VERSION" "$IS_PRERELEASE" \
            "${{ steps.archive-check.outputs.needs_archive }}" \
            "${{ steps.archive-check.outputs.archive_minor }}" \
            "${{ steps.archive-check.outputs.archive_path }}"

      - name: Build current documentation
        working-directory: docs
        run: npm run build
        env:
          NODE_ENV: production
          # Authenticates `gh api` in docs/scripts/fetch-adapter-docs.mjs, which
          # pulls the deploy-adapter docs (agentcore, omnia) at build time.
          GH_TOKEN: ${{ github.token }}

      - name: Check for broken links
        working-directory: docs
        run: npm run check-links

      - name: Merge archived docs into build
        if: github.event_name != 'pull_request'
        run: |
          NEW_ARCHIVE="archive-${{ steps.archive-check.outputs.archive_path }}"
          if [ -d "$NEW_ARCHIVE" ]; then
            cp -r "$NEW_ARCHIVE" "docs/dist/${{ steps.archive-check.outputs.archive_path }}"
          fi
          if [ -d existing-archives ] && [ -n "$(ls -A existing-archives 2>/dev/null)" ]; then
            cp -r existing-archives/* docs/dist/ 2>/dev/null || true
          fi
          ls -la docs/dist/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The 10-minute default is too short: Pages has held deploys queued
          # ~4 min and then syncing ~5 min, so the action cancelled a deploy
          # that was still progressing.
          timeout: 1800000
