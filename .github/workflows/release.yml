name: Release

# Releases are cut from the Actions tab, not by pushing a tag.
#
#   gh workflow run release.yml -f version=v1.5.8
#   gh workflow run release.yml -f version=v1.5.8 -f dry_run=true   # validate only
#
# The tag is created by this workflow AFTER a full snapshot build succeeds,
# rather than being the thing that starts it. That ordering is the point: a
# tag-triggered release publishes its version number before anything has been
# checked, so a failure burns that version — the Go module proxy caches the tag
# within seconds and it can never point anywhere else. Every failed release used
# to leave an orphaned tag behind for exactly this reason.
#
# The snapshot build in `validate` runs the real thing: goreleaser's before-hooks
# (which install and build the embedded web UI from a private registry) and every
# cross-compile, with publishing disabled. That is what catches environment drift
# — a missing token or permission — before a version number is spent on it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, including the v (e.g. v1.5.8)'
        required: true
        type: string
      dry_run:
        description: 'Validate only: run the full snapshot build, create no tag and publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # create tags and GitHub releases
  # The embedded web UI pulls @altairalabs/atlas from GitHub Packages, and
  # goreleaser's before-hook installs it. An explicit permissions block sets
  # every unlisted scope to none, so this read is named for completeness — but
  # the install authenticates with the NODE_AUTH_TOKEN org secret, not
  # GITHUB_TOKEN, since atlas is published from another repository.
  packages: read

jobs:
  validate:
    name: Validate (snapshot build, no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A tag that already exists cannot be reused: the module proxy has it
      # pinned to whatever commit it pointed at first. Fail here rather than
      # discovering it after the build.
      - name: Version is unused
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists — pick the next version"
            exit 1
          fi
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          echo "previous release: ${PREV:-none}"
          if [ -n "$PREV" ] && [ "$(printf '%s\n%s\n' "$PREV" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not greater than the latest tag $PREV"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@10
      # pnpm 10 refuses to expand ${NODE_AUTH_TOKEN} in a *project* .npmrc: that
      # file is committed, so a hostile registry line in it could exfiltrate the
      # secret. It still honours credentials from a trusted source, and the
      # user-level ~/.npmrc is one. Without this pnpm sends no auth header at
      # all and GitHub Packages answers 401 — which is what killed v1.5.7 and
      # every dry run since. The project .npmrc still maps the @altairalabs
      # scope to the registry; only the credential has to move.
      - name: Authenticate to GitHub Packages
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # goreleaser's `sboms` block shells out to syft, and goreleaser-action
      # does not install it: without this the release fails at the SBOM step.
      - uses: anchore/sbom-action/download-syft@v0
      # The real release path with publishing switched off: before-hooks, every
      # cross-compile, archives. Anything that would fail the release fails here,
      # while the version is still unspent.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: go test ./... -count=1

  tag:
    name: Tag ${{ inputs.version }}
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

  goreleaser:
    name: GoReleaser (binaries + GitHub release + Homebrew)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      # Check out the tag itself: goreleaser derives the version from the git
      # state, so it has to be standing on the tag it is releasing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
      # Node + pnpm are needed by goreleaser's before-hooks, which build the
      # embedded Arena web UI (arena/web/frontend) so `promptarena serve` isn't
      # a blank page in released binaries.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm@10
      # pnpm 10 refuses to expand ${NODE_AUTH_TOKEN} in a *project* .npmrc: that
      # file is committed, so a hostile registry line in it could exfiltrate the
      # secret. It still honours credentials from a trusted source, and the
      # user-level ~/.npmrc is one. Without this pnpm sends no auth header at
      # all and GitHub Packages answers 401 — which is what killed v1.5.7 and
      # every dry run since. The project .npmrc still maps the @altairalabs
      # scope to the registry; only the credential has to move.
      - name: Authenticate to GitHub Packages
        run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Install ALSA dev headers (for voice CGO)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # goreleaser's `sboms` block shells out to syft, and goreleaser-action
      # does not install it: without this the release fails at the SBOM step.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew cask push to AltairaLabs/homebrew-tap
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm-publish:
    name: npm publish
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for npm provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The binaries now ship as per-platform packages that the two main
      # packages pull in as optionalDependencies. That replaced a `postinstall`
      # downloader: npm 12 blocks dependency lifecycle scripts unless the
      # consumer allowlists them, so the old postinstall silently never ran and
      # every install produced a CLI that could not find its binary.
      #
      # Repacking goreleaser's own published archives keeps the bytes on npm
      # byte-identical to the GitHub release and the Homebrew cask.
      - name: Download release archives
        run: |
          mkdir -p release-archives
          gh release download "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --dir release-archives \
            --pattern '*.tar.gz' --pattern '*.zip'
          ls -l release-archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build platform packages
        run: |
          VERSION="${{ inputs.version }}"
          node scripts/npm-platform-packages.mjs \
            --version "${VERSION#v}" \
            --archives release-archives \
            --out dist/npm

      # Order matters: the main packages pin their optionalDependencies to this
      # exact version, so those must already resolve on the registry by the time
      # the main package is published.
      - name: Publish platform packages
        run: |
          VERSION="${{ inputs.version }}"
          for dir in dist/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            # Versions are immutable on npm, so a retry after a partial failure
            # must skip what already landed rather than dying on EPUBLISHCONFLICT.
            if npm view "$name@${VERSION#v}" version >/dev/null 2>&1; then
              echo "skip $name@${VERSION#v} (already published)"
              continue
            fi
            echo "publishing $name"
            npm publish "$dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main packages
        run: |
          VERSION="${{ inputs.version }}"
          for pkg in promptarena packc; do
            npm version "${VERSION#v}" --no-git-tag-version --allow-same-version \
              --prefix "npm/$pkg"
            # Pin the optionalDependency range to the version just published.
            node -e '
              const fs = require("fs");
              const p = process.argv[1];
              const v = process.argv[2];
              const d = JSON.parse(fs.readFileSync(p, "utf8"));
              for (const k of Object.keys(d.optionalDependencies ?? {})) {
                d.optionalDependencies[k] = v;
              }
              fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");
            ' "npm/$pkg/package.json" "${VERSION#v}"
            npm publish "./npm/$pkg" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A published main package whose platform dependency does not resolve is
      # the exact failure this restructure exists to prevent, so prove the real
      # thing from the real registry before the release is called done.
      - name: Smoke test the published packages
        run: |
          VERSION="${{ inputs.version }}"
          BARE="${VERSION#v}"
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null

          # Wait for the registry to serve what we just published. `npm publish`
          # returning success does not mean the version is resolvable yet, and
          # installing immediately gets ETARGET "No matching version found" --
          # which reads as a failed publish when the publish was fine. It failed
          # v1.6.3 exactly this way, after both packages had in fact landed.
          for attempt in $(seq 1 30); do
            if npm view "@altairalabs/promptarena@${BARE}" version >/dev/null 2>&1 \
               && npm view "@altairalabs/packc@${BARE}" version >/dev/null 2>&1; then
              echo "Both packages resolvable after ${attempt} attempt(s)."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::@altairalabs/promptarena@${BARE} and/or packc did not"
              echo "::error::become resolvable within 5 minutes. Check whether the"
              echo "::error::publish step actually succeeded before assuming lag."
              exit 1
            fi
            sleep 10
          done

          npm install "@altairalabs/promptarena@${BARE}" \
                      "@altairalabs/packc@${BARE}" --no-audit --no-fund
          ./node_modules/.bin/promptarena --version
          ./node_modules/.bin/packc version

  major-tag:
    name: Update floating major tag (for @vN action refs)
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      # Consumers reference the composite actions as
      # AltairaLabs/promptarena/.github/actions/<name>@v1. Move the floating
      # major tag (v1) to this release so that ref keeps resolving. This tag is
      # co-located with the latest vX.Y.Z release commit, so Go ignores it
      # (not a complete semver version) and GoReleaser changelogs are unaffected.
      - name: Move major tag to this release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ inputs.version }}"
          MAJOR="${VERSION%%.*}"   # v1.5.8 -> v1
          git tag -fa "$MAJOR" -m "Release $VERSION"
          git push origin "$MAJOR" --force

  # The adapters depend on this module for the deploy contract — deploy and
  # deploy/adaptersdk moved here from PromptKit. Each one listens for a
  # promptarena-release dispatch and opens its own bump PR.
  #
  # Without this the listener on the far side never fires: a new adaptersdk
  # release reaches no adapter, and the contract they implement drifts from the
  # one they compile against until somebody notices by hand.
  #
  # continue-on-error throughout: a release is already published by the time
  # this runs, so failing to notify one adapter must not fail the release. The
  # bump can always be raised manually.
  notify-adapters:
    name: Notify the deploy adapters
    needs: major-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - promptarena-deploy-vertex
          - promptarena-deploy-foundry
          - PromptArena-deploy-omnia
          - promptarena-deploy-agentcore
    steps:
      - name: Dispatch to ${{ matrix.repo }}
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ matrix.repo }}
          # A cross-repository dispatch cannot use GITHUB_TOKEN: it is scoped to
          # this repository. Same token PromptKit uses for the same job.
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          echo "Notifying $REPO of promptarena/$VERSION..."
          gh api "repos/AltairaLabs/$REPO/dispatches" \
            -f event_type=promptarena-release \
            -f "client_payload[version]=$VERSION"
          echo "✓ Dispatched to $REPO"
